[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gatekeeper"
version = "0.1.0"
description = "An agent that reads public job boards and refuses to be told what to do by them."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
gatekeeper = "gatekeeper.cli:main"

[tool.setuptools.packages.find]
include = ["gatekeeper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
